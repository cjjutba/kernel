"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Runs in every new workspace. --frozen-lockfile installs exactly what the lockfile says, and fails if it is out of date.
# The postinstall hook inside the root install rebuilds better-sqlite3 and node-pty for Electron.
# site/ is its own package with its own lockfile, so it gets its own install.
setup = '''
node -e 'process.exit(Number(process.versions.node.split(".")[0]) < 22 ? 1 : 0)' || { echo "Kernel needs Node 22 or later"; exit 1; }
pnpm install --frozen-lockfile
pnpm --dir site install --frozen-lockfile
'''
# Every dev instance opens the same Electron userData folder and SQLite database, so only one runs at a time.
run_mode = "nonconcurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "pnpm dev"
default = true
icon = "play"

[scripts.run.site]
available_in = [ "local" ]
command = 'pnpm --dir site dev --port "${CONDUCTOR_PORT:-3000}"'
icon = "globe"
