"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Installs exactly what the lockfile says. The postinstall hook rebuilds the native modules for Electron.
setup = "pnpm install --frozen-lockfile"
# Every dev instance opens the same Electron userData folder and SQLite database, so only one runs at a time.
run_mode = "nonconcurrent"
# Gitignored build output only. Nothing outside the workspace is touched.
archive = "rm -rf out dist site/.next site/.next-e2e"

[scripts.run.dev]
available_in = [ "local" ]
command = "pnpm dev"
default = true
icon = "play"

[scripts.run.site]
available_in = [ "local" ]
# The website is a separate package in site/, so its dependencies install on first run instead of in setup.
command = "pnpm --dir site install --frozen-lockfile && pnpm --dir site dev --port $CONDUCTOR_PORT"
icon = "globe"
