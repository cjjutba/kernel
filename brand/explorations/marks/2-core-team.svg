  <rect x="88" y="8" width="24" height="72" rx="4"/>
  <rect x="40" y="88" width="72" height="24" rx="4"/>
  <rect x="8" y="40" width="24" height="72" rx="4"/>
  <circle cx="60" cy="60" r="20"/>
</svg>
