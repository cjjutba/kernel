# Kernel settings for this repo (Kernel builds itself).
[scripts]
setup = "pnpm install"
run = "pnpm dev"
run_mode = "single"

[files]
copy = [".env", ".env.local"]

[workspace]
base_ref = "origin/main"
branch_pattern = "{type}/{task}-{slug}"

[mcp.aliases]
claude_ai_Linear = "linear"

# The security review runs on PRs that touch permissions and approvals, hooks, accounts and providers, or secrets (KERNEL-773).
[review.security]
paths = [
  "src/main/services/approvals.ts",
  "src/main/services/bashGuard.ts",
  "src/main/services/permissions.ts",
  "src/main/features/permissions.ts",
  "src/main/services/filesToCopy.ts",
  "src/main/windowGuard.ts",
  "src/main/services/hookServer.ts",
  "src/main/services/hooksInstaller.ts",
  "src/main/services/hookToken.ts",
  "src/main/services/claudeSettings.ts",
  "src/main/features/hooks.ts",
  "src/main/services/account.ts",
  "src/main/services/providers",
  "src/main/features/account.ts",
  "src/main/features/providers.ts",
  "src/main/services/env.ts",
  "src/main/features/env.ts",
  "src/main/services/integrations.ts",
  "src/main/services/github.ts",
  "src/main/services/kernelServer.ts",
  "src/main/services/kernelMcp.ts",
  "src/main/services/exec.ts",
]
