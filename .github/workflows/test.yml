name: Test

# A PR runs typecheck and only the tests its changes affect. A push to main runs the whole suite, so two PRs that each
# passed and break main together show up right away (KERNEL-296).
# No path filter, so the Test job reports on every PR and can be a required check on main, like Release note (see release-note.yml).
# Typecheck and the tests run on Ubuntu: it is faster than macOS, and GitHub runs 20 Ubuntu jobs at once against 5 macOS jobs
# per account, so PRs don't queue for a runner. The files named *.mac.test.ts need the Mac (zsh, the Mac build of Codex), so
# they run in their own macOS job, on every PR and every push to main. They take seconds, so there is no affected-files gate:
# one would only delay that job until the Ubuntu run had said which tests are affected.
#
# The Build job runs pnpm build (electron-vite, all three bundles) on every PR and every push to main, so a PR can't break
# bundling and still show a green Test. Packaging (electron-builder, the signed DMG) stays in pnpm release. The build
# doesn't load the native modules, so Build installs without scripts and shares Typecheck's key prefix and node_modules.
# The full suite on macOS is a separate workflow, test-mac.yml (nightly, release PRs, by hand).
#
# Cache: the install is the slowest step of a small PR, so each job restores node_modules instead of installing. The key is
# runner OS, architecture, Node and pnpm version, and a hash of pnpm-lock.yaml, package.json, pnpm-workspace.yaml and
# scripts/sqlite-node.ts (the inputs of the postinstall script). Native builds are only ever restored into the OS,
# architecture and Node version they were built for. Typecheck installs without scripts and has its own key prefix, so
# it never hands the test jobs a node_modules without native builds. A miss installs normally, so the postinstall script
# runs, and saves the cache. A hit skips the install and the postinstall script, which is right because nothing it reads
# changed. The pnpm store cache of setup-node is off: its key is the lockfile hash too, so it missed whenever this one did.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  # Never cancel a main run: each commit on main gets its own result, and the ci-main-red issue names that commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The version of Node setup-node resolved, so a new patch release misses the cache instead of serving the old build.
      - name: Read the Node and pnpm versions
        id: ver
        run: echo "key=$(node -v)-pnpm$(pnpm -v)" >> "$GITHUB_OUTPUT"

      # node_modules with the native builds and the Electron download. See the Cache section at the top of this file.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: typecheck-${{ runner.os }}-${{ runner.arch }}-node${{ steps.ver.outputs.key }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'scripts/sqlite-node.ts') }}

      # No install scripts: tsc doesn't need the native modules rebuilt for Electron. Its own key prefix, because
      # this node_modules has no native builds and the test jobs must never restore it.
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Saved right after the install, so a failing test run doesn't throw the install away.
      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - run: pnpm typecheck

  # Proves the app bundles. No native modules needed, so it shares Typecheck's node_modules (same key prefix).
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The version of Node setup-node resolved, so a new patch release misses the cache instead of serving the old build.
      - name: Read the Node and pnpm versions
        id: ver
        run: echo "key=$(node -v)-pnpm$(pnpm -v)" >> "$GITHUB_OUTPUT"

      # Same key as Typecheck: node_modules installed without scripts. See the Cache section at the top of this file.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: typecheck-${{ runner.os }}-${{ runner.arch }}-node${{ steps.ver.outputs.key }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'scripts/sqlite-node.ts') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - run: pnpm build

  # Runs the tests. Named apart from the Test job below, which is the one branch protection requires.
  vitest:
    name: Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KERNEL_HEADLESS: '1'
    outputs:
      failed: ${{ steps.failed.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base needs the history of main.
          fetch-depth: 0

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The version of Node setup-node resolved, so a new patch release misses the cache instead of serving the old build.
      - name: Read the Node and pnpm versions
        id: ver
        run: echo "key=$(node -v)-pnpm$(pnpm -v)" >> "$GITHUB_OUTPUT"

      # node_modules with the native builds and the Electron download. See the Cache section at the top of this file.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: vitest-${{ runner.os }}-${{ runner.arch }}-node${{ steps.ver.outputs.key }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'scripts/sqlite-node.ts') }}

      # The postinstall script rebuilds better-sqlite3 and node-pty for Electron, then better-sqlite3 for Node (KERNEL-735),
      # and downloads Electron. It runs on every miss.
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Saved right after the install, so a failing test run doesn't throw the install away.
      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      # A PR runs the tests its changes affect, compared with where it left main. The merge base, not HEAD^1, so a
      # re-run after main moved compares the same commits. Anything that changes how every test runs runs them all.
      - name: Pick the tests
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Push to main: the full suite."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          echo "Merge base with origin/$BASE_REF: $base"
          git diff --name-only "$base" HEAD
          if git diff --name-only "$base" HEAD | grep -E '^(package\.json|pnpm-lock\.yaml|vitest\.config\.ts|test/support/|test/helpers\.ts|\.github/workflows/)'; then
            echo "A file that every test depends on changed: the full suite."
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "Only the tests the changes affect."
            echo "args=--changed $base --passWithNoTests" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the tests
        run: |
          start=$(date +%s)
          status=0
          pnpm exec vitest run ${{ steps.pick.outputs.args }} --reporter=default --reporter=json --outputFile.json=vitest-result.json || status=$?
          echo "Wall time of the vitest run: $(( $(date +%s) - start )) s"
          exit $status

      - name: Summary
        if: always()
        run: |
          [ -f vitest-result.json ] || exit 0
          node -e "const r=require('./vitest-result.json');console.log('## Vitest\n\n'+(process.env.ARGS?'Affected tests only':'Full suite')+': '+r.numTotalTestSuites+' suites, '+r.numTotalTests+' tests, '+r.numFailedTests+' failed.')" >> "$GITHUB_STEP_SUMMARY"
        env:
          ARGS: ${{ steps.pick.outputs.args }}

      # The files with a failing test, for the ci-main-red issue.
      - name: Name the failing tests
        id: failed
        if: failure()
        run: |
          [ -f vitest-result.json ] || exit 0
          files=$(node -e "const r=require('./vitest-result.json');console.log(r.testResults.filter(t=>t.status==='failed').map(t=>t.name.replace(process.cwd()+'/','')).join(','))")
          echo "files=$files" >> "$GITHUB_OUTPUT"

  # The tests that only run on the Mac (test/*.mac.test.ts). The Ubuntu run leaves them out (see vitest.config.ts).
  vitest-mac:
    name: Vitest (macOS)
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      KERNEL_HEADLESS: '1'
    outputs:
      failed: ${{ steps.failed.outputs.files }}
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The version of Node setup-node resolved, so a new patch release misses the cache instead of serving the old build.
      - name: Read the Node and pnpm versions
        id: ver
        run: echo "key=$(node -v)-pnpm$(pnpm -v)" >> "$GITHUB_OUTPUT"

      # node_modules with the native builds and the Electron download. See the Cache section at the top of this file.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: vitest-mac-${{ runner.os }}-${{ runner.arch }}-node${{ steps.ver.outputs.key }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', 'scripts/sqlite-node.ts') }}

      # Same postinstall as the Ubuntu job. Its own key prefix and the runner OS keep the builds apart.
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # Saved right after the install, so a failing test run doesn't throw the install away.
      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - name: Run the macOS-only tests
        run: pnpm exec vitest run mac.test.ts --reporter=default --reporter=json --outputFile.json=vitest-result.json

      # The files with a failing test, for the ci-main-red issue.
      - name: Name the failing tests
        id: failed
        if: failure()
        run: |
          [ -f vitest-result.json ] || exit 0
          files=$(node -e "const r=require('./vitest-result.json');console.log(r.testResults.filter(t=>t.status==='failed').map(t=>t.name.replace(process.cwd()+'/','')).join(','))")
          echo "files=$files" >> "$GITHUB_OUTPUT"

  # The one check branch protection requires. It passes only when every job it needs succeeded, and it runs even when one
  # of them fails, is cancelled or is skipped, so the check always reports.
  # A skipped job fails the gate. To allow a skip on purpose, put an `if` on that job and accept "skipped" for it in the
  # script below, for that job only, e.g. `if (name === 'vitest-mac' && result === 'skipped') continue;`.
  test:
    name: Test
    needs: [typecheck, build, vitest, vitest-mac]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          echo "$RESULTS" | node -e "
            const needs = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            let bad = 0;
            for (const [name, { result }] of Object.entries(needs)) {
              console.log(name + ': ' + result);
              if (result !== 'success') bad = 1;
            }
            process.exit(bad);
          "

  # A red main is easy to see: one open issue while it is red, updated by each failing run, closed on the next green run.
  main-red:
    name: Main status
    needs: [test, vitest, vitest-mac]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.test.result }}
      SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-main-red.sh
          sparse-checkout-cone-mode: false

      - name: Open, update or close the ci-main-red issue
        env:
          FAILED: ${{ needs.vitest.outputs.failed }},${{ needs.vitest-mac.outputs.failed }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          CLOSE: 'true'
        run: scripts/ci-main-red.sh
