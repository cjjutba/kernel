name: Site

on:
  pull_request:
    paths: ['site/**', 'design/site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'design/site/**', '.github/workflows/site.yml']
  # Ship the site by hand from main, for example after a deploy that failed for a reason outside the code.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in site/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          # Read-only token for the star count, so the build isn't rate limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # End to end, axe, the visual comparison with the design renders, and the JS budget.
      - run: pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 14

      - name: Upload the side-by-side comparisons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-comparison
          path: site/test-results/compare
          if-no-files-found: ignore
          retention-days: 30

  # The only way the site reaches production. Vercel's Git integration is off in site/vercel.json, because it
  # deployed on every push to main whether site/ changed or not, and those builds used up the account's daily
  # deployment limit for every project on it. This job runs when the path filter above says the site changed, or
  # by hand, and only after the checks pass. Vercel still builds it, from the project's root directory, site/.
  deploy:
    needs: site
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Not secrets. They name the Vercel team and the kernel project, so the CLI needs no .vercel folder.
      VERCEL_ORG_ID: team_3mAiEwDWaFx0otQvMPYeMD3f
      VERCEL_PROJECT_ID: prj_LZ1l9OXIiJh9Vz1Xbzb9trfMdLqf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc

      # Run from the repo root. The project's root directory is site/, so Vercel looks for site/ in the upload.
      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@54.21.1 deploy --prod --yes --archive=tgz --token="$VERCEL_TOKEN"
