name: Release note

# Fails a PR that changes app files without a fragment in .changes/unreleased/ (D-058, .changes/README.md).
# No path filter: it is a required check on main, so it has to report on every PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: release-note-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-note:
    name: Release note
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          # The scripts are .ts files run by Node itself. 22.18 is the first 22.x with type stripping on by default.
          node-version: '22.18'
          cache: npm

      # zod is a runtime dependency, so this installs it without Electron's build tooling, and no install scripts run.
      - run: npm ci --omit=dev --ignore-scripts

      # The schema lives in site/ and imports zod. site/ isn't installed here, so zod has to resolve from the root.
      - name: Load the shared schema
        run: |
          node --version
          node -p "'zod resolves from site/lib to ' + require.resolve('zod', { paths: ['site/lib'] })"
          node -e "import('./site/lib/schema.ts').then((m) => console.log('site/lib/schema.ts loaded with', Object.keys(m).length, 'exports'))"

      - name: Check for a release note
        run: node scripts/release-note-check.ts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
