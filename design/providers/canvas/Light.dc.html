<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Providers, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Main" theme="light" tab="{{ tab }}" tab-style="{{ tabStyle }}" hint-size="1440px,1100px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"enum","options":["claude","codex"],"default":"claude"},"tabStyle":{"editor":"enum","options":["underline","segmented","pill"],"default":"underline"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { tab: this.props.tab || 'claude', tabStyle: this.props.tabStyle || 'underline' };
  }
}
</script>
</body>
</html>
