<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Providers, 1024px window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="Main" frame-width="1024" theme="{{ theme }}" tab-style="{{ tabStyle }}" hint-size="1024px,1100px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"tabStyle":{"editor":"enum","options":["underline","segmented","pill"],"default":"underline"},"$preview":{"width":1024,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme || 'dark', tabStyle: this.props.tabStyle || 'underline' };
  }
}
</script>
</body>
</html>
