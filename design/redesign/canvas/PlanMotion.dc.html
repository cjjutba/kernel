<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kernel plan mode motion</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.k{--panel:#0f1011;--surface-3:#1c1d21;--line:#1a1b1e;--line-2:#23252a;--line-3:#2a2b30;--line-4:#3a3c42;--ink:#f7f8f8;--ink-2:#d0d6e0;--muted:#8a8f98;--faint:#62666d;--on-ink:#08090a;--input-bg:#0b0c0d}
.k{font-family:'Inter',-apple-system,system-ui,sans-serif;font-feature-settings:'cv01','ss03';-webkit-font-smoothing:antialiased;font-size:13px;line-height:1.45;color:var(--ink);background:var(--panel)}
.k *{box-sizing:border-box}
.k button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{height:24px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);font-size:12px;color:var(--muted);transition:color .2s ease-out,border-color .2s ease-out}
.step.on{color:var(--ink);border-color:var(--line-4)}
.cap{margin:0;font-size:13px;color:var(--ink-2);min-height:19px}
.cmp{--plan:#5aa2ff;--ease:cubic-bezier(.33,0,.2,1);position:relative;display:flex;flex-direction:column;gap:6px;background:var(--input-bg);border:1px solid var(--line-2);border-radius:12px;padding:12px 12px 10px;transition:border-color 1.6s ease-in-out}
.cmp > *{position:relative}
.cmp::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(130% 115% at 50% 135%,rgba(90,162,255,.26) 0%,rgba(90,162,255,.09) 42%,rgba(90,162,255,0) 70%);opacity:0;transform:scaleY(.85);transform-origin:50% 100%;transition:opacity 1.6s ease-in-out,transform 1.6s ease-in-out}
.cmp.focus{border-color:var(--line-4);transition:border-color .6s ease-out}
.cmp.plan{border-color:rgba(90,162,255,.45);transition:border-color 2.4s var(--ease)}
.cmp.plan.focus{border-color:rgba(90,162,255,.7);transition:border-color .6s ease-out}
.cmp.plan::before{opacity:.9;transform:none;transition:opacity 2.4s var(--ease),transform 2.4s var(--ease);animation:plan-breathe 8s ease-in-out 2.4s infinite}
.cmp.plan.focus::before{opacity:1;animation:none;transition:opacity 1s ease-out}
@keyframes plan-breathe{0%,100%{opacity:.9}50%{opacity:.62}}
.cmp-text{min-height:34px;font-size:14px;line-height:24px;color:var(--ink)}
.cmp-text.ph{color:var(--muted)}
.caret{display:inline-block;width:1.5px;height:17px;background:var(--ink);vertical-align:-3px}
.cmp.plan .caret{background:var(--plan)}
.cmp-foot{display:flex;align-items:center;gap:12px}
.cmp-agent{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border:1px solid var(--line-3);border-radius:999px;font-size:12.5px}
.cmp-agent .n{color:var(--ink-2)}
.cmp-agent .r,.cmp-model .r{color:var(--muted)}
.cmp-model{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}
.k .ib{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.k .send{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-3);color:var(--muted);transition:background-color .16s ease-out,color .16s ease-out}
.k .send.on{background:var(--ink);color:var(--on-ink)}
.k .cmp.plan .send.on{background:var(--plan);color:#06101e}
.k .cmp.plan.wait .send.on{background:var(--ink);color:var(--on-ink)}
.k .send.stop{background:transparent;border:1px solid var(--line-4)}
.send.stop span{width:9px;height:9px;border-radius:2px;background:var(--ink)}
.pbar{display:flex;align-items:center;gap:6px;margin:-12px -12px 6px;padding:7px 8px 7px 12px;overflow:hidden;border-radius:11px 11px 0 0;background:rgba(90,162,255,.08);border-bottom:1px solid rgba(90,162,255,.24);animation:pbar-in 1.2s var(--ease) both}
.pbar > *{position:relative}
.pbar::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,rgba(90,162,255,0) 30%,rgba(90,162,255,.18) 50%,rgba(90,162,255,0) 70%);transform:translateX(-100%);animation:pbar-sweep 2.6s ease-in-out .6s both}
@keyframes pbar-in{from{max-height:0;opacity:0;padding-top:0;padding-bottom:0}to{max-height:44px;opacity:1}}
@keyframes pbar-sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pbar .ic{display:inline-flex;color:var(--plan)}
.k .pb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.k .pb.acc{background:var(--plan);color:#06101e}
.pb .kb{font-family:'Geist Mono',ui-monospace,monospace;font-size:11px;font-weight:400;opacity:.6}
@media (prefers-reduced-motion: reduce){.cmp,.cmp::before,.k .send,.pbar,.pbar::before,.step{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="k" style="width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center">
<div style="width: 640px; display: flex; flex-direction: column; gap: 14px">
<div class="steps">
<span class="{{steps.0}}">Normal</span>
<span class="{{steps.1}}">Plan mode</span>
<span class="{{steps.2}}">Typing</span>
<span class="{{steps.3}}">Planning</span>
<span class="{{steps.4}}">Plan waiting</span>
<span class="{{steps.5}}">Typing changes</span>
<span class="{{steps.6}}">Approved</span>
</div>
<p class="cap">{{caption}}</p>
<div class="{{cls}}" style="margin-top: 10px">
<sc-if value="{{showBar}}" hint-placeholder-val="{{ false }}"><div class="pbar"><span class="ic"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 15px; height: 15px"><path d="M10.5 3.5h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h1M6.5 2h3a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-3A.5.5 0 0 1 6 4.5v-2a.5.5 0 0 1 .5-.5ZM6 7.7h4M6 10.3h4"></path></svg></span><span style="flex: 1"></span><button class="pb"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 13px; height: 13px"><path d="M5.5 5.5h7v8h-7ZM3.5 10.5v-8h7"></path></svg>Copy</button><button class="pb acc">Approve<span class="kb">⌘⇧↵</span></button></div></sc-if>
<sc-if value="{{typed}}" hint-placeholder-val="{{ false }}"><div class="cmp-text">{{text}}<span class="caret"></span></div></sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ true }}"><div class="cmp-text ph">{{placeholder}}</div></sc-if>
<div class="cmp-foot">
<span class="cmp-agent"><span class="n">Rowan</span><span class="r">Lead</span></span>
<span class="cmp-model">Opus 5.5<span class="r">Extra high</span><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 12px; height: 12px; color: var(--muted)"><path d="M4.5 6.5 8 10l3.5-3.5"></path></svg></span>
<svg viewBox="0 0 16 16" aria-hidden="true" style="width: 16px; height: 16px; margin-left: auto"><circle cx="8" cy="8" r="5.5" fill="none" stroke="var(--line-3)" stroke-width="2"></circle><path d="M8 2.5a5.5 5.5 0 0 1 4.8 2.8" fill="none" stroke="var(--muted)" stroke-width="2"></path></svg>
<button class="ib" aria-label="Add"><svg class="i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"></path></svg></button>
<sc-if value="{{showStop}}" hint-placeholder-val="{{ false }}"><button class="send stop" aria-label="Stop"><span></span></button></sc-if>
<sc-if value="{{showSend}}" hint-placeholder-val="{{ true }}"><button class="{{sendCls}}" aria-label="Send"><svg class="i" viewBox="0 0 16 16" aria-hidden="true" style="width: 14px; height: 14px; stroke-width: 1.8"><path d="M8 13V3.5M3.8 7.6 8 3.4l4.2 4.2"></path></svg></button></sc-if>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  steps() {
    const ask = 'Ask Rowan to make changes, @mention files, run /skills'
    return [
      { label: 'Normal', cap: 'Normal', cls: 'cmp', ph: ask, ms: 3000 },
      { label: 'Plan mode', cap: 'Plan mode turns on. The glow rises, then breathes.', cls: 'cmp plan', ph: ask, ms: 10500 },
      { label: 'Typing', cap: 'Plan mode, typing. The glow holds steady.', cls: 'cmp plan focus', type: 'Plan back and forward for this round, and reopen where I left off.', ms: 3600 },
      { label: 'Planning', cap: 'Sent. Rowan is planning.', cls: 'cmp plan', ph: 'Add a follow up', stop: true, ms: 3000 },
      { label: 'Plan waiting', cap: 'Plan waiting for you. The strip slides in with one sweep.', cls: 'cmp plan wait', bar: true, ph: 'Enter your plan adjustments here', ms: 5600 },
      { label: 'Typing changes', cap: 'Plan waiting, typing changes. Send stays ink.', cls: 'cmp plan wait focus', bar: true, type: 'Split step 2 into its own PR.', ms: 3200 },
      { label: 'Approved', cap: 'Approved. Plan mode turns off and the glow fades.', cls: 'cmp', ph: ask, ms: 3600 }
    ]
  }
  componentDidMount() { this.go(0) }
  componentWillUnmount() { clearTimeout(this.t); clearInterval(this.k) }
  go(i) {
    const all = this.steps()
    const s = all[i]
    clearInterval(this.k)
    this.setState({ i: i, n: 0 })
    if (s.type) {
      this.k = setInterval(() => {
        const n = ((this.state && this.state.n) || 0) + 1
        if (n >= s.type.length) clearInterval(this.k)
        this.setState({ n: n })
      }, 34)
    }
    this.t = setTimeout(() => this.go((i + 1) % all.length), s.ms)
  }
  renderVals() {
    const all = this.steps()
    const st = this.state || {}
    const i = st.i || 0
    const s = all[i]
    const text = s.type ? s.type.slice(0, st.n || 0) : ''
    return {
      steps: all.map((x, j) => (j === i ? 'step on' : 'step')),
      caption: s.cap,
      cls: s.cls,
      showBar: !!s.bar,
      typed: !!s.type,
      empty: !s.type,
      text: text,
      placeholder: s.ph || '',
      showStop: !!s.stop,
      showSend: !s.stop,
      sendCls: text ? 'send on' : 'send'
    }
  }
}
</script>
</body>
</html>
