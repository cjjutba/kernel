<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kernel · History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HELMET-->
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; overflow: hidden; border-radius: 12px; border: 1px solid #26272b; background: #08090a; color: #f7f8f8; font-family: 'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-feature-settings: 'cv01', 'ss03'; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased">
<!--SIDEBAR-->
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 8px 0 0; box-sizing: border-box">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #0f1011; border: 1px solid #1d1e22; border-radius: 10px; overflow: hidden">
<header style="height: 44px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px">
<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#d0d6e0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.6"></circle><path d="M8 5v3.2l2.1 1.3"></path></svg>
<h1 style="margin: 0; font-size: 13px; font-weight: 500">History</h1>
<span style="flex: 1"></span>
<label for="h-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search history</label>
<input id="h-q" type="text" autocomplete="off" value="{{ q }}" onChange="{{ onQ }}" placeholder="Search workspaces" style="width: 240px; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 7px; border: 1px solid #23252a; background: #0b0c0d; color: #f7f8f8; font-family: inherit; font-size: 12.5px; outline: none">
</header>
<div style="height: 44px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid #1a1b1e">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><button type="button" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}" style="height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid {{ t.border }}; background: {{ t.bg }}; color: {{ t.color }}; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{ t.label }}<span style="margin-left: 6px; font-size: 12px; color: #8a8f98">{{ t.count }}</span></button></sc-for>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 20px 24px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<p style="margin: 16px 8px 6px; font-size: 12px; font-weight: 500; color: #8a8f98">{{ g.title }}</p>
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.4fr) 110px 120px 90px 96px; gap: 16px; align-items: center; height: 52px; padding: 0 8px; border-top: 1px solid #17181a">
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.name }}</span><span style="font-size: 12px; color: #8a8f98">{{ r.agent }}</span></span>
<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #b7bcc4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.branch }}</span>
<span style="color: #d0d6e0">{{ r.room }}</span>
<span style="font-size: 12.5px; color: {{ r.prColor }}">{{ r.pr }}</span>
<span style="font-size: 12px; color: #8a8f98">{{ r.when }}</span>
<sc-if value="{{ r.canRestore }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ r.restore }}" style="justify-self: end; height: 28px; padding: 0 12px; border: 1px solid #2a2b30; border-radius: 7px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">Restore</button></sc-if>
<sc-if value="{{ r.restored }}" hint-placeholder-val="{{ false }}"><a href="Workspace.dc.html" style="justify-self: end; color: #f7f8f8; font-size: 12.5px; font-weight: 500">Open</a></sc-if>
</div>
</sc-for>
</sc-for>
<sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin: 40px 8px; color: #8a8f98">No archived workspaces match.</p></sc-if>
</div>
</div>
<!--FOOTER-->
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', q: '', restored: {} };
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var D = [
      ['Today', 'org-invites', 'Theo', 'feat/t-10-org-invites', 'Client A', '#41 merged', '14:02', 'merged'],
      ['Today', 'docker-local-startup', 'Noor', 'fix/docker-local-startup', 'Client A', '#40 merged', '11:20', 'merged'],
      ['Today', 'try-datatable', 'Kai', 'spike/try-datatable', 'Client A', 'No PR', '09:48', 'none'],
      ['This week', 'auth-orgs', 'Noor', 'feat/t-08-auth-orgs', 'Client A', '#36 merged', 'Mon', 'merged'],
      ['This week', 'landing-polish', 'Kai', 'feat/landing-polish', 'Portfolio', '#12 merged', 'Mon', 'merged'],
      ['This week', 'pricing-experiment', 'Rowan', 'spike/pricing-experiment', 'Own app', '#7 closed', 'Sun', 'closed']
    ];
    var q = (s.q || '').toLowerCase();
    var list = D.filter(function (r) { return (s.tab === 'all' || (s.tab === 'merged' ? r[7] === 'merged' : r[7] !== 'merged')) && (!q || (r[1] + ' ' + r[3] + ' ' + r[4]).toLowerCase().indexOf(q) >= 0); });
    var groups = ['Today', 'This week'].map(function (g) {
      return { title: g, rows: list.filter(function (r) { return r[0] === g; }).map(function (r) {
        var done = !!s.restored[r[1]];
        return { name: r[1], agent: r[2], branch: r[3], room: r[4], pr: r[5], prColor: r[7] === 'merged' ? '#b9a3f5' : '#8a8f98', when: r[6], canRestore: !done, restored: done,
          restore: function () { var n = Object.assign({}, s.restored); n[r[1]] = true; self.setState({ restored: n }); } };
      }) };
    }).filter(function (g) { return g.rows.length; });
    var tabs = [['all', 'All', D.length], ['merged', 'Merged', D.filter(function (r) { return r[7] === 'merged'; }).length], ['other', 'Not merged', D.filter(function (r) { return r[7] !== 'merged'; }).length]].map(function (t) {
      var on = s.tab === t[0];
      return { label: t[1], count: String(t[2]), pressed: on ? 'true' : 'false', bg: on ? '#1c1d21' : 'transparent', border: on ? '#2a2b30' : '#1f2024', color: on ? '#f7f8f8' : '#8a8f98', pick: function () { self.setState({ tab: t[0] }); } };
    });
    return { groups: groups, tabs: tabs, empty: groups.length === 0, q: s.q, onQ: function (e) { self.setState({ q: e.target.value }); } };
  }
}
</script>
</body>
</html>
