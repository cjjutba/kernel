<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kernel · Menu bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HELMET-->
<div style="width: 420px; height: 540px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #050506; color: #f7f8f8; font-family: 'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-feature-settings: 'cv01', 'ss03'; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; background: #18191a; border-bottom: 1px solid #23252a">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; background: #2e3036">
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#f7f8f8" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2.2 13.8 5.3 8 8.4 2.2 5.3Z"></path><path d="M2.2 8.2 8 11.3l5.8-3.1"></path><path d="M2.2 11 8 14.1l5.8-3.1"></path></svg>
<span style="font-size: 12px; font-weight: 600; color: {{ accent }}">{{ count }}</span>
</span>
</div>

<section aria-label="Kernel" style="margin: 6px 10px 0 auto; width: 364px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 12px; border: 1px solid #2a2b30; background: #141516">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; padding: 0 14px; border-bottom: 1px solid #1f2024">
<span style="display: flex; align-items: center; gap: 8px; font-weight: 600"><span aria-hidden="true" style="width: 18px; height: 18px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid #2a2b30; background: #1c1d21; font-size: 10px">A</span>Client A</span>
<span style="font-size: 12px; color: #8a8f98">4 working</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px">
<p style="margin: 0 2px 6px; font-size: 12px; font-weight: 500; color: #8a8f98">Needs you</p>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid #3a3c42; background: #18191c">
<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 500">Noor wants to run</p>
<p style="margin: 0; padding: 8px 10px; border-radius: 6px; border: 1px solid #23252a; background: #0a0b0c; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px">pnpm drizzle-kit push</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" onClick="{{ deny }}" style="height: 30px; border: 1px solid #2a2b30; border-radius: 8px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Deny</button>
<button type="button" onClick="{{ approve }}" style="height: 30px; border: 0; border-radius: 8px; background: #f7f8f8; color: #08090a; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Approve</button>
</div>
</div>
</sc-if>
<sc-if value="{{ closed }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid #23252a">
<span style="flex: 1; color: #d0d6e0">{{ result }}</span>
<button type="button" onClick="{{ undo }}" style="height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: #1c1d21; color: #d0d6e0; font-family: inherit; font-size: 12px; cursor: pointer">Undo</button>
</div>
</sc-if>
<a href="Board.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 8px; color: #f7f8f8; text-decoration: none">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">Plan for T-15 is ready</span><span style="font-size: 12px; color: #8a8f98">Rowan</span></span>
<span style="font-size: 12px; color: #d0d6e0">Review</span>
</a>
<a href="Board.dc.html" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 10px; border-radius: 8px; color: #f7f8f8; text-decoration: none">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 500">T-09 is ready to merge</span><span style="font-size: 12px; color: #8a8f98">Theo</span></span>
<span style="font-size: 12px; color: #d0d6e0">Open PR</span>
</a>
</div>

<div style="padding: 0 12px 12px">
<div class="cmp" style="position: relative; display: flex; align-items: center; gap: 6px; height: 40px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 10px; border: 1px solid #23252a; background: #0f1011">
<label for="quick" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Brief Rowan</label>
<input id="quick" type="text" autocomplete="off" placeholder="Brief Rowan" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" style="flex: 1; min-width: 0; height: 30px; padding: 0; border: 0; outline: none; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px">
<button type="button" onClick="{{ send }}" aria-label="Send to Rowan" style="width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 50%; background: {{ sendBg }}; color: {{ sendColor }}; cursor: pointer"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3.5M3.8 7.6 8 3.4l4.2 4.2"></path></svg></button>
</div>
<sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}"><p style="margin: 6px 2px 0; font-size: 12px; color: #8a8f98">Sent to Rowan</p></sc-if>
</div>

<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 14px; border-top: 1px solid #1f2024; color: #d0d6e0; text-decoration: none">Open Kernel<span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #8a8f98">⌘O</span></a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":540}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { result: null, draft: '', sent: false };
  }

  send() {
    if (!(this.state.draft || '').trim()) return;
    this.setState({ draft: '', sent: true });
  }

  renderVals() {
    var self = this;
    var accent = this.props.accent ?? '#f7f8f8';
    var r = this.state.result;
    var has = (this.state.draft || '').trim().length > 0;
    return {
      accent: accent,
      open: r === null,
      closed: r !== null,
      count: r === null ? '3' : '2',
      result: r === 'approved' ? 'Approved. Noor is migrating.' : 'Denied. Noor will try another way.',
      approve: function () { self.setState({ result: 'approved' }); },
      deny: function () { self.setState({ result: 'denied' }); },
      undo: function () { self.setState({ result: null }); },
      draft: this.state.draft,
      sent: this.state.sent && !has,
      onDraft: function (e) { self.setState({ draft: e.target.value, sent: false }); },
      onKey: function (e) { if (e.key === 'Enter') { e.preventDefault(); self.send(); } },
      send: function () { self.send(); },
      sendBg: has ? '#f7f8f8' : '#1c1d21',
      sendColor: has ? '#08090a' : '#8a8f98'
    };
  }
}
</script>
</body>
</html>
