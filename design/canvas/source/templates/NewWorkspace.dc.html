<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kernel · New workspace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--HELMET-->
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; overflow: hidden; border-radius: 12px; border: 1px solid #26272b; background: #08090a; color: #f7f8f8; font-family: 'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-feature-settings: 'cv01', 'ss03'; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased">
<!--SIDEBAR-->
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 8px 0 0; box-sizing: border-box">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; background: #0f1011; border: 1px solid #1d1e22; border-radius: 10px; overflow: hidden">
<header style="height: 44px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #1a1b1e"><span style="color: #d0d6e0">Client A</span><span style="color: #62666d">/</span><h1 style="margin: 0; font-size: 13px; font-weight: 500">Team</h1></header>
<div aria-hidden="true" style="flex: 1"></div>
</div>
<!--FOOTER-->
</div>

<a href="Team.dc.html" aria-label="Close" class="scrim" style="position: absolute; inset: 0; z-index: 40; background: rgba(0, 0, 0, 0.55)"></a>

<section role="dialog" aria-modal="true" aria-label="New workspace" style="position: absolute; z-index: 50; left: 50%; top: 170px; transform: translateX(-50%); width: 680px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 14px; border: 1px solid #2a2b30; background: #18191b">

<div style="position: relative; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 10px 0 12px; border-bottom: 1px solid #26272b">
<button type="button" onClick="{{ cycleRoom }}" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer"><span aria-hidden="true" style="width: 18px; height: 18px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid #2a2b30; background: #1c1d21; font-size: 10px; font-weight: 600">{{ room.letter }}</span>{{ room.name }}<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4 5 6.5 7.5 4"></path></svg></button>
<button type="button" onClick="{{ openBranch }}" aria-label="Branch options" aria-expanded="{{ x.branch }}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: {{ bg.branch }}; color: #8a8f98; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.1" fill="currentColor"></circle><circle cx="8" cy="8" r="1.1" fill="currentColor"></circle><circle cx="12.5" cy="8" r="1.1" fill="currentColor"></circle></svg></button>
<span style="flex: 1"></span>
<button type="button" onClick="{{ openFrom }}" aria-label="Start from a PR, branch or issue" aria-expanded="{{ x.from }}" style="display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: {{ bg.from }}; color: #d0d6e0; font-family: inherit; font-size: 13px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="4.5" cy="3.8" r="1.5"></circle><circle cx="4.5" cy="12.2" r="1.5"></circle><circle cx="11.5" cy="12.2" r="1.5"></circle><path d="M4.5 5.3v5.4M11.5 10.7V6.5a1.5 1.5 0 0 0-1.5-1.5H7.5M8.8 3.6 7.4 5l1.4 1.4"></path></svg>{{ fromLabel }}<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4 5 6.5 7.5 4"></path></svg></button>

<sc-if value="{{ menu.branch }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Branch options" style="position: absolute; left: 140px; top: 48px; z-index: 10; width: 340px; box-sizing: border-box; padding: 6px; border-radius: 10px; border: 1px solid #2a2b30; background: #1c1d20">
<button type="button" class="mi" onClick="{{ cycleTarget }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; color: #b7bcc4">Target branch</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px">{{ target }}</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 6 3-3 3 3M5 10l3 3 3-3"></path></svg></button>
<button type="button" class="mi" onClick="{{ cycleMode }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1; color: #b7bcc4">Runs in</span><span>{{ modeLabel }}</span><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 6 3-3 3 3M5 10l3 3 3-3"></path></svg></button>
<p style="margin: 4px 10px 6px; font-size: 12px; line-height: 1.45; color: #8a8f98">{{ modeHint }}</p>
</div>
</sc-if>

<sc-if value="{{ menu.from }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Start from" style="position: absolute; right: 8px; top: 48px; z-index: 10; width: 460px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a2b30; background: #1c1d20; overflow: hidden">
<label for="from-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search by title, number, or author</label>
<input id="from-q" type="text" autocomplete="off" value="{{ q }}" onChange="{{ onQ }}" placeholder="Search by title, number, or author" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px; border: 0; border-bottom: 1px solid #26272b; outline: none; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13.5px">
<div role="tablist" style="display: flex; gap: 4px; padding: 8px 8px 4px">
<sc-for list="{{ fromTabs }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: {{ t.bg }}; color: {{ t.color }}; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">{{ t.label }}</button></sc-for>
</div>
<div style="display: flex; flex-direction: column; padding: 4px 6px 6px">
<sc-for list="{{ fromRows }}" as="r" hint-placeholder-count="4"><button type="button" class="mi" onClick="{{ r.pick }}" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 8px; border: 0; border-radius: 6px; background: {{ r.bg }}; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="width: 52px; flex-shrink: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #8a8f98">{{ r.id }}</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ r.title }}</span><span style="font-size: 12px; color: #8a8f98">{{ r.hint }}</span></button></sc-for>
</div>
</div>
</sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 6px">
<sc-if value="{{ hasFrom }}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 8px; border-radius: 6px; border: 1px solid #2e3036; background: #1c1d21; font-size: 12px; color: #d0d6e0"><span style="font-family: 'Geist Mono', ui-monospace, monospace">{{ fromChip }}</span><button type="button" onClick="{{ clearFrom }}" aria-label="Clear" style="width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #8a8f98; cursor: pointer"><svg width="9" height="9" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"></path></svg></button></span></sc-if>
<label for="nw-prompt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">What do you want to work on?</label>
<textarea id="nw-prompt" rows="7" value="{{ prompt }}" onChange="{{ onPrompt }}" placeholder="What do you want to work on?" style="resize: none; padding: 0; border: 0; outline: none; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 15px; line-height: 1.55"></textarea>
</div>

<div style="position: relative; display: flex; align-items: center; gap: 6px; padding: 10px 10px 12px 12px">
<button type="button" onClick="{{ openModel }}" aria-expanded="{{ x.model }}" style="display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: {{ bg.model }}; color: #f7f8f8; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{ modelLabel }}<span style="color: #8a8f98; font-weight: 400">{{ effortLabel }}</span><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4 5 6.5 7.5 4"></path></svg></button>
<sc-if value="{{ plan }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ togglePlan }}" aria-label="Turn off plan mode" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid #3a3c42; border-radius: 7px; background: #1c1d21; color: #f7f8f8; font-family: inherit; font-size: 12px; font-weight: 500; cursor: pointer">Plan mode<svg width="9" height="9" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="2" stroke-linecap="round"><path d="m4 4 8 8M12 4l-8 8"></path></svg></button></sc-if>
<span style="flex: 1"></span>
<button type="button" onClick="{{ openPlus }}" aria-label="Plan mode and attachments" aria-expanded="{{ x.plus }}" style="width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: {{ bg.plus }}; color: #b7bcc4; cursor: pointer"><svg width="16" height="16" viewBox="0 0 12 12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M6 2v8M2 6h8"></path></svg></button>
<a href="WorkspaceLead.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 14px; border-radius: 8px; background: #f7f8f8; color: #08090a; text-decoration: none; font-size: 13px; font-weight: 500">Create<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3.5v4a2 2 0 0 1-2 2H3.5M6 7 3.5 9.5 6 12"></path></svg></a>

<sc-if value="{{ menu.model }}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Model" style="position: absolute; left: 10px; bottom: 50px; z-index: 10; width: 340px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a2b30; background: #1c1d20; overflow: hidden">
<label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search models</label>
<input id="mq" type="text" autocomplete="off" value="{{ mq }}" onChange="{{ onMq }}" placeholder="Search models" style="width: 100%; height: 42px; box-sizing: border-box; padding: 0 14px; border: 0; border-bottom: 1px solid #26272b; outline: none; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13.5px">
<div style="display: flex; flex-direction: column; padding: 6px">
<sc-for list="{{ models }}" as="o" hint-placeholder-count="4"><button type="button" role="menuitemradio" class="mi" aria-checked="{{ o.checked }}" onClick="{{ o.pick }}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: {{ o.bg }}; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="font-weight: 500">{{ o.label }}</span><span style="flex: 1; color: #8a8f98">{{ o.effort }}</span><span style="font-size: 12px; color: #8a8f98">{{ o.key }}</span></button></sc-for>
<div style="height: 1px; margin: 6px 4px; background: #2a2b30"></div>
<button type="button" class="mi" onClick="{{ cycleEffort }}" style="display: flex; align-items: center; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1">Effort</span><span style="color: #8a8f98">{{ effortLabel }}</span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 14px; border-top: 1px solid #26272b; font-size: 12px; color: #8a8f98"><a href="SettingsModels.dc.html" style="color: #b7bcc4; text-decoration: none">Edit defaults</a><span>⌘⇧/ cycle effort</span></div>
</div>
</sc-if>

<sc-if value="{{ menu.plus }}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Add" style="position: absolute; right: 90px; bottom: 50px; z-index: 10; width: 240px; box-sizing: border-box; padding: 6px; border-radius: 10px; border: 1px solid #2a2b30; background: #1c1d20">
<button type="button" role="menuitemcheckbox" class="mi" aria-checked="{{ planChecked }}" onClick="{{ togglePlanMenu }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1">{{ planLabel }}</span><span style="font-size: 12px; color: #8a8f98">⇧Tab</span></button>
<button type="button" class="mi" onClick="{{ attach }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span style="flex: 1">Add attachment</span><span style="font-size: 12px; color: #8a8f98">⌘U</span></button>
</div>
</sc-if>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: '%%MENU%%' === 'none' ? null : '%%MENU%%', room: 0, target: 0, mode: 0, from: null, fromTab: 'prs', q: '', mq: '', model: 'sonnet', effort: 'high', plan: false, prompt: '%%MENU%%' === 'none' ? '' : 'Export invoices as PDF. Spec first.' };
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var rooms = [['A', 'Client A'], ['B', 'Client B'], ['O', 'Own app']];
    var targets = ['origin/main', 'origin/dev'];
    var modes = [['New worktree', 'An isolated copy on its own branch, named from your task.'], ['Current branch', 'Works in your checkout. Changes already there are kept and left out of the diff.']];
    var toggle = function (name) { return function () { self.setState({ menu: s.menu === name ? null : name }); }; };
    var D = {
      prs: [['#44', 'feat(invoices): PDF renderer with embedded fonts'], ['#43', 'fix(auth): invite links expire after 7 days'], ['#41', 'feat(org): invite members by email'], ['#39', 'chore(db): seed realistic invoices']],
      branches: [['', 'feat/t-14-invoice-table'], ['', 'feat/t-12-invoice-schema'], ['', 'fix/docker-local-startup'], ['', 'main']],
      issues: [['T-16', 'Client portal login'], ['T-17', 'Bulk export for accountants'], ['T-18', 'Dark mode for invoice PDFs']]
    };
    var q = (s.q || '').toLowerCase();
    var rowsData = D[s.fromTab].filter(function (r) { return !q || (r[0] + ' ' + r[1]).toLowerCase().indexOf(q) >= 0; });
    var fromRows = rowsData.map(function (r, i) {
      return { id: r[0], title: r[1], hint: i === 0 ? 'Select ↵' : '', bg: i === 0 ? '#26272b' : 'transparent', pick: function () { self.setState({ from: (r[0] ? r[0] + ' ' : '') + r[1], menu: null }); } };
    });
    var fromTabs = [['prs', 'PRs'], ['branches', 'Branches'], ['issues', 'Issues']].map(function (t) {
      var on = s.fromTab === t[0];
      return { label: t[1], sel: on ? 'true' : 'false', bg: on ? '#2a2b30' : 'transparent', color: on ? '#f7f8f8' : '#8a8f98', pick: function () { self.setState({ fromTab: t[0] }); } };
    });
    var modelDefs = [['fable', 'Fable 5.1', '^⌘1'], ['opus', 'Opus 5.5', '^⌘2'], ['sonnet', 'Sonnet 5.5', '^⌘3'], ['haiku', 'Haiku 4.5', '^⌘4']];
    var effortDefs = [['low', 'Low'], ['medium', 'Medium'], ['high', 'High'], ['xhigh', 'Extra high']];
    var effortLabel = effortDefs.filter(function (d) { return d[0] === s.effort; })[0][1];
    var mq = (s.mq || '').toLowerCase();
    var models = modelDefs.filter(function (d) { return !mq || d[1].toLowerCase().indexOf(mq) >= 0; }).map(function (d) {
      var on = s.model === d[0];
      return { label: d[1], effort: on ? effortLabel : '', key: on ? 'Selected' : d[2], checked: on ? 'true' : 'false', bg: on ? '#26272b' : 'transparent', pick: function () { self.setState({ model: d[0], menu: null }); } };
    });
    var m = s.menu;
    return {
      room: { letter: rooms[s.room][0], name: rooms[s.room][1] },
      cycleRoom: function () { self.setState({ room: (s.room + 1) % rooms.length }); },
      menu: { branch: m === 'branch', from: m === 'from', model: m === 'model', plus: m === 'plus' },
      x: { branch: m === 'branch' ? 'true' : 'false', from: m === 'from' ? 'true' : 'false', model: m === 'model' ? 'true' : 'false', plus: m === 'plus' ? 'true' : 'false' },
      bg: { branch: m === 'branch' ? '#26272b' : 'transparent', from: m === 'from' ? '#26272b' : 'transparent', model: m === 'model' ? '#26272b' : 'transparent', plus: m === 'plus' ? '#26272b' : 'transparent' },
      openBranch: toggle('branch'), openFrom: toggle('from'), openModel: toggle('model'), openPlus: toggle('plus'),
      target: targets[s.target], cycleTarget: function () { self.setState({ target: (s.target + 1) % targets.length }); },
      modeLabel: modes[s.mode][0], modeHint: modes[s.mode][1], cycleMode: function () { self.setState({ mode: (s.mode + 1) % modes.length }); },
      fromLabel: s.from ? 'From ' + s.from.split(' ')[0] : 'New branch',
      hasFrom: !!s.from, fromChip: s.from || '', clearFrom: function () { self.setState({ from: null }); },
      fromTabs: fromTabs, fromRows: fromRows, q: s.q, onQ: function (e) { self.setState({ q: e.target.value }); },
      prompt: s.prompt, onPrompt: function (e) { self.setState({ prompt: e.target.value }); },
      modelLabel: modelDefs.filter(function (d) { return d[0] === s.model; })[0][1], effortLabel: effortLabel,
      models: models, mq: s.mq, onMq: function (e) { self.setState({ mq: e.target.value }); },
      cycleEffort: function () { var i = effortDefs.map(function (d) { return d[0]; }).indexOf(s.effort); self.setState({ effort: effortDefs[(i + 1) % effortDefs.length][0] }); },
      plan: s.plan, togglePlan: function () { self.setState({ plan: false }); },
      planChecked: s.plan ? 'true' : 'false', planLabel: s.plan ? 'Plan mode is on' : 'Plan mode',
      togglePlanMenu: function () { self.setState({ plan: !s.plan, menu: null }); },
      attach: function () { self.setState({ menu: null, prompt: (s.prompt ? s.prompt + ' ' : '') + '[mockup.png]' }); }
    };
  }
}
</script>
</body>
</html>
