<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kernel · Settings</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#f7f8f8}a:hover{color:#ffffff}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid rgba(247,248,248,.55);outline-offset:1px}
.cmp:focus-within{border-color:#3a3c42}
input::placeholder,textarea::placeholder{color:#8a8f98}
.pin{animation:pin 1.8s ease-out infinite}
.pina{animation:pina 1.4s ease-out infinite}
@keyframes pin{0%{box-shadow:0 0 0 0 rgba(247,248,248,.4)}100%{box-shadow:0 0 0 6px rgba(247,248,248,0)}}
@keyframes pina{0%{box-shadow:0 0 0 0 rgba(245,165,36,.55)}100%{box-shadow:0 0 0 7px rgba(245,165,36,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
.bob{transform-box:fill-box;animation:bob .9s ease-in-out infinite}
@keyframes stride{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.8px)}}
.stride{transform-box:fill-box;animation:stride .32s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
@media (prefers-reduced-motion: reduce){.pin,.pina,.spin,.bob,.stride{animation:none}}
.hv .more{opacity:0;transition:opacity .12s}
.hv:hover .more,.hv:focus-within .more,.hv .more.show,.hv .more:has(details[open]){opacity:1}
details.dd{position:relative}
details.dd>summary{list-style:none}
details.dd>summary::-webkit-details-marker{display:none}
.mi:hover{background:#232428}
.row:hover{background:#141518}
.scrim{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.msg .acts{opacity:0;transition:opacity .12s}
.msg:hover .acts,.msg:focus-within .acts,.acts.show{opacity:1}
.sk{display:block;background:#18191c;animation:skp 1.4s ease-in-out infinite}
@keyframes skp{50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; overflow: hidden; border-radius: 12px; border: 1px solid #26272b; background: #08090a; color: #f7f8f8; font-family: 'Inter', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-feature-settings: 'cv01', 'ss03'; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased">

<nav aria-label="Settings" style="width: 236px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 8px 0 10px">
<div style="height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 6px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<a href="Home.dc.html" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; color: #d0d6e0; text-decoration: none"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"></path></svg>Back to app</a>
<div style="position: relative; margin: 8px 0 6px">
<label for="set-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Search settings</label>
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-linecap="round" style="position: absolute; left: 10px; top: 9px"><circle cx="7" cy="7" r="4.3"></circle><path d="m10.3 10.3 3.2 3.2"></path></svg>
<input id="set-q" type="text" autocomplete="off" value="{{ q }}" onChange="{{ onQ }}" placeholder="Search settings" style="width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px 0 30px; border-radius: 8px; border: 1px solid #23252a; background: #0f1011; color: #f7f8f8; font-family: inherit; font-size: 13px; outline: none">
</div>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
<sc-if value="{{ g.show }}" hint-placeholder-val="{{ true }}">
<p style="margin: 10px 0 2px; padding: 0 8px; font-size: 12px; font-weight: 500; color: #8a8f98">{{ g.title }}</p>
<sc-for list="{{ g.items }}" as="n" hint-placeholder-count="4">
<button type="button" onClick="{{ n.pick }}" aria-current="{{ n.current }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: {{ n.bg }}; color: {{ n.color }}; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer">
<sc-if value="{{ n.isIcon }}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="{{ n.stroke }}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.icon }}"></path></svg></sc-if>
<sc-if value="{{ n.isLetter }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 15px; height: 15px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid #2a2b30; font-size: 8.5px; font-weight: 600">{{ n.letter }}</span></sc-if>
{{ n.label }}
</button>
</sc-for>
</sc-if>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 8px 0 0; box-sizing: border-box">
<div style="flex: 1; min-height: 0; overflow-y: auto; background: #0f1011; border: 1px solid #1d1e22; border-radius: 10px">
<div style="max-width: 700px; margin: 0 auto; padding: 52px 24px 40px; display: flex; flex-direction: column; gap: 28px">
<div>
<h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.6px">{{ page.title }}</h1>
<sc-if value="{{ page.hasIntro }}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 0 0; color: #8a8f98; font-size: 14px">{{ page.intro }}</p></sc-if>
</div>
<sc-for list="{{ page.sections }}" as="sec" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; padding-left: 2px; font-size: 15px; font-weight: 500">{{ sec.title }}</h2>
<div style="border-radius: 10px; border: 1px solid #1f2024; background: #141516">
<sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; column-gap: 24px; row-gap: 10px; min-height: 58px; box-sizing: border-box; padding: 12px 18px; border-top: {{ r.border }}">
<div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13.5px; font-weight: 500">{{ r.label }}</span>
<sc-if value="{{ r.hasDesc }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12.5px; color: #8a8f98">{{ r.desc }}</span></sc-if>
</div>
<sc-if value="{{ r.isSelect }}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ r.act }}" style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid #23252a; border-radius: 7px; background: #18191a; color: #f7f8f8; font-family: inherit; font-size: 13px; cursor: pointer">{{ r.value }}<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" fill="none" stroke="#8a8f98" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4 5 6.5 7.5 4"></path></svg></button></sc-if>
<sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ false }}"><button type="button" role="switch" aria-checked="{{ r.checked }}" aria-label="{{ r.label }}" onClick="{{ r.act }}" style="width: 32px; height: 20px; position: relative; flex-shrink: 0; padding: 0; border: 0; border-radius: 999px; background: {{ r.swBg }}; cursor: pointer"><span aria-hidden="true" style="position: absolute; top: 2px; left: {{ r.knob }}; width: 16px; height: 16px; border-radius: 50%; background: {{ r.knobBg }}"></span></button></sc-if>
<sc-if value="{{ r.isSegment }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="{{ r.label }}" style="display: flex; gap: 2px; padding: 2px; border-radius: 8px; border: 1px solid #23252a; background: #0f1011">
<sc-for list="{{ r.segs }}" as="sg" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ sg.checked }}" onClick="{{ sg.pick }}" style="height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: {{ sg.bg }}; color: {{ sg.color }}; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">{{ sg.label }}</button></sc-for>
</div></sc-if>
<sc-if value="{{ r.isButton }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ r.act }}" style="height: 30px; padding: 0 12px; border: 1px solid #2a2b30; border-radius: 7px; background: transparent; color: #f7f8f8; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{ r.value }}</button></sc-if>
<sc-if value="{{ r.isValue }}" hint-placeholder-val="{{ false }}"><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; color: #d0d6e0">{{ r.value }}</span></sc-if>
<sc-if value="{{ r.isKbd }}" hint-placeholder-val="{{ false }}"><span style="display: flex; gap: 4px"><sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="2"><span style="min-width: 22px; height: 22px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; border-radius: 5px; border: 1px solid #2a2b30; background: #18191a; font-size: 12px; color: #d0d6e0">{{ k }}</span></sc-for></span></sc-if>
<sc-if value="{{ r.isMeter }}" hint-placeholder-val="{{ false }}"><div style="flex-basis: 100%; display: flex; flex-direction: column; gap: 6px"><div role="meter" aria-label="{{ r.label }}" aria-valuenow="{{ r.num }}" aria-valuemin="0" aria-valuemax="100" style="height: 6px; border-radius: 3px; background: #23252a; overflow: hidden"><div style="width: {{ r.pct }}; height: 100%; border-radius: 3px; background: {{ r.barColor }}"></div></div><span style="font-size: 12px; color: #8a8f98">{{ r.value }}</span></div></sc-if>
<sc-if value="{{ r.isCode }}" hint-placeholder-val="{{ false }}"><div style="flex-basis: 100%; display: flex; flex-direction: column; padding: 10px 12px; border-radius: 8px; border: 1px solid #23252a; background: #0a0b0c; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12.5px; line-height: 1.7; color: #d0d6e0"><sc-for list="{{ r.lines }}" as="ln" hint-placeholder-count="2"><span style="white-space: pre">{{ ln }}</span></sc-for></div></sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</div>
<footer style="height: 40px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; font-size: 12px; color: #8a8f98">
<span></span>
<span style="display: inline-flex; align-items: center; gap: 6px">
<details class="dd"><summary style="list-style: none; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; color: #d0d6e0; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8 13.5 2.8 9.9 13.2 7.6 8.6Z"></path><path d="m7.6 8.6 2.4-2.4"></path></svg>Ask Rowan</summary>
<div role="dialog" aria-label="Ask Rowan" style="position: absolute; right: -30px; bottom: 34px; z-index: 60; width: 360px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; border: 1px solid #2a2b30; background: #18191b; font-size: 13px; color: #f7f8f8">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: #3f4652; font-size: 9px; font-weight: 600">R</span><span style="font-weight: 500">Ask Rowan</span><span style="color: #8a8f98">Client A</span></div>
<label for="quick-ask" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Question for Rowan</label>
<textarea id="quick-ask" rows="3" placeholder="What's the status of T-15? Who is blocked?" style="resize: none; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #26272b; background: #0f1011; color: #f7f8f8; font-family: inherit; font-size: 13px; line-height: 1.5; outline: none"></textarea>
<div style="display: flex; align-items: center; gap: 8px"><span style="flex: 1; font-size: 12px; color: #8a8f98">Answers here without opening a workspace</span><a href="QuickAsk.dc.html" style="display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 7px; background: #f7f8f8; color: #08090a; text-decoration: none; font-size: 12.5px; font-weight: 500">Ask</a></div>
</div></details>

</span>
</footer>
</div>
</div>
</x-dc>

  renderVals() {
    var self = this;
    var s = this.state;
    var accent = this.props.accent ?? '#f7f8f8';
    var icons = this.icons();
    var q = (s.q || '').toLowerCase();
    var groups = this.nav().map(function (g) {
      var items = g.items.filter(function (it) { return !q || it[1].toLowerCase().indexOf(q) >= 0; }).map(function (it) {
        var on = s.page === it[0];
        return {
          label: it[1], isIcon: !it[2], isLetter: !!it[2], letter: it[2] || '', icon: icons[it[0]] || '',
          current: on ? 'page' : 'false', bg: on ? '#1c1d21' : 'transparent', color: on ? '#f7f8f8' : '#d0d6e0', stroke: on ? '#d0d6e0' : '#8a8f98',
          pick: function () { self.setState({ page: it[0] }); }
        };
      });
      return { title: g.title, items: items, show: items.length > 0 };
    });
    var setVal = function (id, v) { var n = Object.assign({}, self.state.vals); n[id] = v; self.setState({ vals: n }); };
    var P = this.pages()[s.page];
    var sections = P.sections.map(function (sec) {
      return { title: sec.title, rows: sec.rows.map(function (r, i) {
        var v = r.id && s.vals[r.id] !== undefined ? s.vals[r.id] : undefined;
        var o = {
          label: r.label, desc: r.desc || '', hasDesc: !!r.desc, border: i === 0 ? '0' : '1px solid #1d1e22',
          isSelect: r.type === 'select', isToggle: r.type === 'toggle', isSegment: r.type === 'segment', isButton: r.type === 'button',
          isValue: r.type === 'value', isCode: r.type === 'code', isKbd: r.type === 'kbd', isMeter: r.type === 'meter',
          pct: (r.pct || 0) + '%', num: String(r.pct || 0), barColor: (r.pct || 0) >= 85 ? '#d0d6e0' : '#f7f8f8',
          value: r.value || '', lines: r.lines || [], keys: r.keys || [], segs: [], act: function () {}
        };
        if (r.type === 'select') {
          var idx = v === undefined ? 0 : v;
          o.value = r.opts[idx];
          o.act = function () { setVal(r.id, (idx + 1) % r.opts.length); };
        }
        if (r.type === 'toggle') {
          var on = v === undefined ? r.on : v;
          o.checked = on ? 'true' : 'false'; o.swBg = on ? '#f7f8f8' : '#2a2b30'; o.knobBg = on ? '#08090a' : '#8a8f98'; o.knob = on ? '14px' : '2px';
          o.act = function () { setVal(r.id, !on); };
        }
        if (r.type === 'segment') {
          var cur = v === undefined ? r.def : v;
          o.segs = r.opts.map(function (lab, j) {
            var sel = cur === j;
            return { label: lab, checked: sel ? 'true' : 'false', bg: sel ? '#24252a' : 'transparent', color: sel ? '#f7f8f8' : '#8a8f98', pick: function () { setVal(r.id, j); } };
          });
        }
        return o;
      }) };
    });
    return {
      accent: accent,
      q: s.q, onQ: function (e) { self.setState({ q: e.target.value }); },
      groups: groups,
      page: { title: P.title, intro: P.intro || '', hasIntro: !!P.intro, sections: sections }
    };
  }
