<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.ks-dark{--k-canvas:#09090a;--k-panel:#121213;--k-card:#161618;--k-surface-2:#1d1d1f;--k-surface-3:#232325;--k-row-hover:#1a1a1c;--k-line-2:#29292b;--k-line-3:#333335;--k-line-4:#424245;--k-panel-line:#222224;--k-pill-line:#232325;--k-input-bg:#151517;--k-ink:#f7f7f8;--k-ink-2:#d6d6d7;--k-ink-3:#b6b6b8;--k-muted:#919194;--k-faint:#6f6f72;--k-needs-fill:#f2c55c;--k-del-fill:#f06363;--k-on-ink:#09090a;--k-ink-hover:#ffffff;--k-nav-hover:#18181a;--k-focus:rgba(247,247,248,.55);--k-frame:#29292b;--k-claude:#d97757;--k-key-bg:#1d1d1f;--k-key-line:#333335}
.ks-light{--k-canvas:#f3f3f4;--k-panel:#ffffff;--k-card:#ffffff;--k-surface-2:#ffffff;--k-surface-3:#eeeef0;--k-row-hover:#f7f7f8;--k-line-2:#e6e6e9;--k-line-3:#d9d9de;--k-line-4:#c4c4ca;--k-panel-line:#ebebee;--k-pill-line:#e6e6e9;--k-input-bg:#ffffff;--k-ink:#18191b;--k-ink-2:#35383f;--k-ink-3:#4c4f56;--k-muted:#62666d;--k-faint:#8a8e96;--k-needs-fill:#d97706;--k-del-fill:#dc3e42;--k-on-ink:#f3f3f4;--k-ink-hover:#000000;--k-nav-hover:#ebebed;--k-focus:rgba(24,25,27,.55);--k-frame:#d6d6db;--k-claude:#d97757;--k-key-bg:#f7f7f8;--k-key-line:#dcdce0}
.ks-app button:focus-visible,.ks-app select:focus-visible,.ks-app input:focus-visible{outline:2px solid var(--k-focus);outline-offset:1px}
.ks-nav{background:transparent;color:var(--k-muted)}.ks-nav:hover{background:var(--k-nav-hover);color:var(--k-ink-2)}.ks-nav.on{background:var(--k-surface-3);color:var(--k-ink)}
.ks-back{background:transparent;color:var(--k-ink-2)}.ks-back:hover{background:var(--k-nav-hover)}
.ks-btn{background:transparent;transition:background .12s}.ks-btn:hover:not(:disabled){background:var(--k-surface-3)}
.ks-icon{background:transparent;color:var(--k-muted);transition:color .12s,background .12s}.ks-icon:hover:not(:disabled){color:var(--k-ink);background:var(--k-surface-3)}
.ks-search{background:var(--k-panel);border:1px solid var(--k-panel-line)}.ks-search::placeholder{color:var(--k-muted)}.ks-search:focus{background:var(--k-input-bg);border-color:var(--k-line-4)}.ks-search:focus-visible{outline:none}
.ks-filter{background:var(--k-input-bg);border:1px solid var(--k-line-3);color:var(--k-ink)}.ks-filter::placeholder{color:var(--k-muted)}.ks-filter:hover{border-color:var(--k-line-4)}.ks-filter:focus{border-color:var(--k-line-4)}.ks-filter:focus-visible{outline:none}
.ks-seg{background:transparent;color:var(--k-muted)}.ks-seg:hover{color:var(--k-ink-2)}.ks-seg.on{background:var(--k-surface-3);color:var(--k-ink)}
.ks-select{appearance:none;-webkit-appearance:none;background:var(--k-input-bg);border:1px solid var(--k-line-3);color:var(--k-ink-2)}.ks-select:hover{border-color:var(--k-line-4)}
.ks-theme{background:transparent;border:1px solid var(--k-pill-line);transition:border-color .12s}.ks-theme:hover{border-color:var(--k-line-4)}.ks-theme.on{border-color:var(--k-ink-3)}
.ks-chip{background:transparent;color:var(--k-muted)}.ks-chip:hover{color:var(--k-ink-2)}
.ks-key{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;box-sizing:border-box;padding:0 5px;border-radius:5px;border:1px solid var(--k-key-line);background:var(--k-key-bg);color:var(--k-ink-3);font-size:11.5px;font-family:inherit}
.ks-meter{display:block;height:3px;flex-shrink:0;border-radius:999px;background:var(--k-line-2);overflow:hidden}
</style>
</helmet>
<div class="ks-app {{ themeCls }}" style="position: relative; width: {{ frameW }}; height: {{ frameH }}; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; border: 1px solid var(--k-frame); background: var(--k-canvas); color: var(--k-ink-2); font-family: 'Geist', -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased">
<div style="flex: 1; min-height: 0; display: flex">

<nav aria-label="Settings" style="width: 236px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 8px 0 10px; overflow: hidden">
<div style="height: 42px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 6px">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #ff5f57"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #febc2e"></span>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #28c840"></span>
</div>
<button type="button" class="ks-back" style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"></path></svg>Back to app</button>
<div style="position: relative; display: flex; align-items: center; margin: 6px 0">
<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="var(--k-faint)" stroke-width="1.5" stroke-linecap="round" style="position: absolute; left: 9px; pointer-events: none"><circle cx="7" cy="7" r="4.3"></circle><path d="m10.3 10.3 3.2 3.2"></path></svg>
<input type="text" class="ks-search" aria-label="Search settings" placeholder="Search settings" style="width: 100%; height: 30px; box-sizing: border-box; padding: 0 10px 0 29px; border-radius: 8px; color: var(--k-ink-2); font-family: inherit; font-size: 13px; outline: none">
</div>
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
<p style="margin: 10px 0 2px; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--k-muted)">{{ g.title }}</p>
<sc-for list="{{ g.items }}" as="n" hint-placeholder-count="5">
<button type="button" class="{{ n.cls }}" aria-current="{{ n.current }}" aria-label="{{ n.aria }}" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="{{ n.d }}"></path></svg><span style="flex: 1">{{ n.label }}</span><sc-if value="{{ n.hasBadge }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--k-muted)">{{ n.badge }}</span></sc-if></button>
</sc-for>
</sc-for>
<p style="margin: 10px 0 2px; padding: 0 8px; font-size: 12px; font-weight: 500; color: var(--k-muted)">Rooms</p>
<button type="button" class="ks-nav" style="width: 100%; display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer"><span aria-hidden="true" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--k-line-3); font-size: 9px; font-weight: 600; color: var(--k-ink-2)">K</span><span style="flex: 1">Kernel</span></button>
</nav>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 8px 8px 0 0">
<main style="position: relative; flex: 1; min-height: 0; overflow: auto; background: var(--k-panel); border: 1px solid var(--k-panel-line); border-radius: 12px">
<div style="max-width: 820px; margin: 0 auto; padding: 56px 24px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.6px; color: var(--k-ink)">{{ title }}</h1>
<sc-if value="{{ hasSubtitle }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; color: var(--k-muted)">{{ subtitle }}</p></sc-if>
</div>

<sc-if value="{{ hasFilter }}" hint-placeholder-val="{{ false }}"><div style="position: relative; display: flex; align-items: center; margin-top: -16px">
<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="var(--k-muted)" stroke-width="1.5" stroke-linecap="round" style="position: absolute; left: 11px; pointer-events: none"><circle cx="7" cy="7" r="4.3"></circle><path d="m10.3 10.3 3.2 3.2"></path></svg>
<input type="text" class="ks-filter" aria-label="Filter shortcuts" placeholder="Filter shortcuts" autocomplete="off" spellcheck="false" value="{{ query }}" onChange="{{ onQuery }}" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 12px 0 31px; border-radius: 10px; font-family: inherit; font-size: 13px">
</div></sc-if>

<sc-if value="{{ hasBanner }}" hint-placeholder-val="{{ false }}"><div role="alert" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; margin-top: -16px; padding: 6px 7px 6px 14px; border-radius: 10px; border: 1px solid var(--k-pill-line); background: var(--k-card)">
<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="var(--k-needs-fill)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M8 2.2 14.6 13.6H1.4ZM8 6.6v3.2M8 11.7v.1"></path></svg>
<span style="flex: 1; min-width: 0; font-size: 13px; color: var(--k-ink-3)"><span style="font-weight: 500; color: var(--k-ink)">macOS is blocking Kernel’s notifications.</span> Nothing below reaches you until you allow them.</span>
<button type="button" class="ks-btn" style="flex-shrink: 0; height: 28px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--k-line-3); color: var(--k-ink-2); font-family: inherit; font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer">Open System Settings</button>
</div></sc-if>

<sc-for list="{{ sections }}" as="sec" hint-placeholder-count="2">
<section aria-label="{{ sec.title }}" style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; padding-left: 2px; display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 500; color: var(--k-ink)">{{ sec.title }}<sc-if value="{{ sec.hasCount }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--k-faint)">{{ sec.count }}</span></sc-if></h2>

<sc-if value="{{ sec.isThemes }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{ t.on }}" class="{{ t.cls }}" onClick="{{ t.pick }}" style="display: flex; flex-direction: column; gap: 10px; padding: 8px 8px 10px; border-radius: 12px; font-family: inherit; text-align: left; cursor: pointer">
<span aria-hidden="true" style="height: 92px; display: flex; overflow: hidden; border-radius: 8px; border: 1px solid var(--k-line-2)">
<sc-for list="{{ t.halves }}" as="h" hint-placeholder-count="1"><span style="width: {{ h.w }}; flex-shrink: 0; overflow: hidden; display: flex; justify-content: {{ h.align }}; background: {{ h.bg }}"><span style="width: {{ h.inner }}; flex-shrink: 0; display: flex"><span style="width: 44px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; padding: 12px 8px"><span style="height: 4px; width: 80%; border-radius: 2px; background: {{ h.bar }}"></span><span style="height: 4px; width: 60%; border-radius: 2px; background: {{ h.bar }}"></span><span style="height: 4px; width: 70%; border-radius: 2px; background: {{ h.bar }}"></span></span><span style="flex: 1; margin: 7px 7px 7px 0; display: flex; flex-direction: column; gap: 6px; padding: 10px; border-radius: 6px; border: 1px solid {{ h.line }}; background: {{ h.panel }}"><span style="height: 5px; width: 45%; border-radius: 2px; background: {{ h.ink }}"></span><span style="height: 4px; width: 85%; border-radius: 2px; background: {{ h.bar }}"></span><span style="height: 4px; width: 70%; border-radius: 2px; background: {{ h.bar }}"></span></span></span></span></sc-for>
</span>
<span style="display: flex; align-items: center; gap: 8px; padding: 0 2px">
<span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid {{ t.ring }}"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{ t.dot }}"></span></span>
<span style="font-size: 13px; font-weight: 500; color: var(--k-ink-2)">{{ t.label }}</span>
</span>
</button>
</sc-for>
</div></sc-if>

<sc-if value="{{ sec.hasRows }}" hint-placeholder-val="{{ true }}"><div style="border-radius: 12px; border: 1px solid var(--k-pill-line); background: var(--k-card)">
<sc-for list="{{ sec.rows }}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 24px; min-height: {{ r.minH }}; box-sizing: border-box; padding: {{ r.pad }}; border-top: 1px solid {{ r.divider }}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span id="{{ r.labelId }}" style="font-size: {{ r.size }}; font-weight: {{ r.weight }}; color: var(--k-ink-2)">{{ r.label }}</span>
<sc-if value="{{ r.hasDesc }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; color: var(--k-muted)">{{ r.desc }}</span></sc-if>
</div>
<sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ true }}"><button type="button" role="switch" aria-checked="{{ r.on }}" aria-labelledby="{{ r.labelId }}" onClick="{{ r.toggle }}" style="position: relative; width: 32px; height: 20px; flex-shrink: 0; padding: 0; border-radius: 999px; border: 1px solid {{ r.tg.border }}; background: {{ r.tg.bg }}; cursor: pointer"><span style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: {{ r.tg.knob }}; transform: translateX({{ r.tg.x }}); transition: transform .12s"></span></button></sc-if>
<sc-if value="{{ r.isSeg }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0"><sc-if value="{{ r.hasPlay }}" hint-placeholder-val="{{ false }}"><button type="button" class="ks-icon" aria-label="{{ r.playAria }}" onClick="{{ r.onPlay }}" style="width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; cursor: pointer"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M5 3.2v9.6L12.6 8z"></path></svg></button></sc-if><span role="radiogroup" aria-labelledby="{{ r.labelId }}" style="display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; padding: 2px; border-radius: 9px; border: 1px solid var(--k-line-3); background: var(--k-input-bg)"><sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ o.on }}" aria-label="{{ o.aria }}" class="{{ o.cls }}" onClick="{{ o.pick }}" style="display: inline-flex; align-items: center; justify-content: center; gap: 4px; height: 24px; padding: 0 10px; border: 0; border-radius: 7px; font-family: inherit; font-size: 12.5px; font-weight: 500; white-space: nowrap; cursor: pointer">{{ o.label }}</button></sc-for></span></span></sc-if>
<sc-if value="{{ r.isSelect }}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: inline-flex; align-items: center; flex-shrink: 0"><select class="ks-select" aria-labelledby="{{ r.labelId }}" value="{{ r.value }}" onChange="{{ r.onSelect }}" style="min-width: 168px; height: 28px; box-sizing: border-box; padding: 0 28px 0 10px; border-radius: 8px; font-family: inherit; font-size: 12.5px; cursor: pointer"><sc-for list="{{ r.options }}" as="o" hint-placeholder-count="3"><option value="{{ o.value }}">{{ o.label }}</option></sc-for></select><svg width="11" height="11" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="var(--k-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 10px; pointer-events: none"><path d="M4 6.5 8 10.5 12 6.5"></path></svg></span></sc-if>
<sc-if value="{{ r.isKeys }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="{{ r.keysAria }}" style="display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0"><sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="2"><kbd class="ks-key">{{ k.k }}</kbd></sc-for></span></sc-if>
</div>
</sc-for>
</div></sc-if>
</section>
</sc-for>

<sc-if value="{{ noMatch }}" hint-placeholder-val="{{ false }}"><p style="margin: -12px 0 0; padding: 32px 0; text-align: center; font-size: 13px; color: var(--k-muted)">No shortcuts match “{{ query }}”</p></sc-if>

</div>
</main>
</div>
</div>

<footer style="height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 10px 0 12px; font-size: 12px; color: var(--k-muted); white-space: nowrap; overflow: hidden">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
<sc-if value="{{ c.isSep }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 1px; height: 14px; background: var(--k-line-3)"></span></sc-if>
<sc-if value="{{ c.isChip }}" hint-placeholder-val="{{ true }}"><button type="button" class="ks-chip" aria-label="{{ c.aria }}" style="display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 4px; border: 0; border-radius: 6px; font-family: inherit; font-size: 12px; cursor: pointer"><sc-if value="{{ c.hasMark }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" fill="{{ c.markFill }}"><path d="{{ c.mark }}"></path></svg></sc-if><span style="color: {{ c.nameColor }}">{{ c.name }}</span><sc-if value="{{ c.hasMeter }}" hint-placeholder-val="{{ false }}"><span class="ks-meter" style="width: 28px"><span style="display: block; width: {{ c.width }}; height: 100%; border-radius: 999px; background: {{ c.fill }}"></span></span></sc-if><span style="font-variant-numeric: tabular-nums; color: {{ c.pctColor }}">{{ c.text }}</span></button></sc-if>
</sc-for>
<button type="button" class="ks-icon" aria-label="Refresh usage" style="width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px; padding: 0; border: 0; border-radius: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.46-3.54"></path><path d="M13 3v2.5h-2.5"></path></svg></button>
<span style="flex: 1"></span>
<button type="button" class="ks-icon" aria-label="Help" style="width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 6px; cursor: pointer"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11z"></path><path d="M6.4 6.4a1.7 1.7 0 0 1 3.2.6c0 1.1-1.6 1.4-1.6 2.3M8 11.3v.01"></path></svg></button>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"page":{"editor":"enum","options":["general","appearance","notifications","shortcuts"],"default":"general"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"blocked":{"editor":"boolean","default":false},"frameWidth":{"editor":null},"frameHeight":{"editor":null},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var props = this.props;
    var set = function (p) { self.setState(p); };
    var V = function (n) { return 'var(--k-' + n + ')'; };
    var noop = function () {};
    var page = props.page || 'general';
    var vals = st.vals || {};
    var val = function (id, d) { return vals[id] !== undefined ? vals[id] : d; };
    var put = function (id, v) { var o = Object.assign({}, self.state && self.state.vals || {}); o[id] = v; set({ vals: o }); };

    // The theme cards change the artboard's own theme, so picking Light shows it. System follows the artboard's prop.
    var picked = val('theme', props.theme === 'light' ? 'light' : 'dark');
    var shown = picked === 'system' ? (props.theme === 'light' ? 'light' : 'dark') : picked;

    var tg = function (on) { return on ? { bg: V('ink'), border: V('ink'), knob: V('on-ink'), x: '12px' } : { bg: V('surface-3'), border: V('line-3'), knob: V('muted'), x: '0px' }; };
    var n = 0;
    var base = function (label, extra) { n += 1; return Object.assign({ label: label, labelId: 'ks-l-' + n, desc: '', hasDesc: false, isToggle: false, isSeg: false, isSelect: false, isKeys: false, on: false, tg: tg(false), toggle: noop, opts: [], options: [], value: '', onSelect: noop, keys: [], keysAria: '', hasPlay: false, playAria: '', onPlay: noop, minH: '52px', pad: '12px 16px', size: '13.5px', weight: '500' }, extra || {}); };
    var toggle = function (id, label, d, desc) { var on = val(id, d); return base(label, { isToggle: true, on: on, tg: tg(on), toggle: function () { put(id, !on); }, desc: desc || '', hasDesc: !!desc }); };
