# Settings for pnpm (D-014, D-110). site/ has its own pnpm-workspace.yaml and isn't part of this one (D-056).

# Dependencies that may run install scripts. Anything not listed fails the install (strictDepBuilds).
# The allowed ones are pinned, so a bump has to be approved again here.
allowBuilds:
  better-sqlite3@12.11.1: true
  node-pty@1.1.0: true
  esbuild: false
  fsevents: false
  electron-winstaller: false

# Temporary, for the Claude Agent SDK 0.3.300 bump: these were under pnpm's one day release age when the bump landed.
# Remove them after Oct 16, 2026.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.300'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.300'
