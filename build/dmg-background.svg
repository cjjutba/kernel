<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440">
  <title>Kernel installer background</title>
  <!-- Source for build/background.png (660x440) and build/background@2x.png (1320x880), exported by scripts/export-dmg-background.mjs.
       Colors are DESIGN.md light tokens: canvas #f3f3f4, line-2 #dedee2, ink #18191b, muted #62666d, faint #7b7f88.
       dmg-builder sizes the Finder window to this image and Finder's title bar covers the bottom 32pt, so everything sits above y 408.
       The wordmark and headline are Inter 600 converted to outlines (the site's brand face), so they render the same on any Mac.
       The lockup is design/brand/wordmark-ink.svg scaled to the old wordmark's width and baseline; regenerate it from there, not by hand. -->
  <rect width="660" height="440" fill="#f3f3f4"/>
  <defs>
    <pattern id="dots" x="6" y="2" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.5" fill="#c9c9cf"/></pattern>
    <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" gradientTransform="translate(330 236) scale(330 120)">
      <stop offset="0" stop-color="#fff"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotfade"><rect x="0" y="73" width="660" height="335" fill="url(#fade)"/></mask>
  </defs>
  <!-- faint dot grid, 1px dots on an 18pt pitch, fading out from the icon row so the header, labels and footnote stay clean -->
  <rect width="660" height="408" fill="url(#dots)" mask="url(#dotfade)"/>
  <!-- header hairline -->
  <rect x="0" y="72" width="660" height="1" fill="#dedee2"/>
