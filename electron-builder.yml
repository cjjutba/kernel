# Packaging, signing, notarization and publishing (KERNEL-30). See docs/RELEASING.md.
appId: com.cjjutba.kernel
productName: Kernel
copyright: Copyright © 2026 Christian Jerald Jutba
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - docs/starter-agents/**
  - package.json
  # Native modules load from build/Release (rebuilt for Electron), so their prebuilds, sources, install scripts and
  # the Windows-only winpty would only be signed and shipped unused (D-052).
  - '!node_modules/node-pty/{prebuilds,deps,src,scripts,node-addon-api}/**'
  - '!node_modules/better-sqlite3/{deps,src}/**'
# Spawned or dlopened from disk, so they can't live inside app.asar. electron-builder signs them where they land.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-darwin-arm64/**
  # Codex's binary, pinned in package.json, which Codex chats run as `codex app-server` (KERNEL-406).
  - node_modules/@openai/codex-darwin-arm64/**
# Flipped in the packaged binary (KERNEL-208). With these off, no local process can run its own code under Kernel's
# signature and Automation grant through ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect, and the app only loads
# from an app.asar whose hash matches the one signed into Info.plist.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Flipping a fuse edits the binary and voids its ad hoc signature, and macOS kills an arm64 binary with a void
  # signature. This signs it ad hoc again so unsigned pnpm dist:mac builds still run. A release signs it for real after.
  resetAdHocDarwinSignature: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  artifactName: ${productName}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarizes when APPLE_KEYCHAIN_PROFILE is set (scripts/release.sh sets kernel-notary) and skips otherwise.
  notarize: true
dmg:
  artifactName: ${productName}-${arch}.${ext}
  # build/background.png and build/background@2x.png come from build/dmg-background.svg (KERNEL-796). dmg-builder sizes the
  # window to that image and ignores window while a background is set, and Finder counts its 32pt title bar in that height,
  # so the art keeps its content above y 408. The icon centers sit on the arrow's line in that art.
  title: Kernel ${version}
  window:
    width: 660
    height: 440
  iconSize: 128
  contents:
    - x: 165
      y: 236
      type: file
    - x: 495
      y: 236
      type: link
      path: /Applications
# Where installed copies look for updates (written into the app as app-update.yml). scripts/release.sh uploads the
# release with gh after the build passes its checks, so electron-builder itself never publishes. It also passes
# releaseInfo.releaseNotesFile, rendered from site/content/releases/<version>.md, which is copied into latest-mac.yml
# for What's new (D-058).
publish:
  provider: github
  owner: cjjutba
  repo: kernel
